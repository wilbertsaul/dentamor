; Permite que php-fpm conserve las variables de entorno del contenedor.
;
; Por defecto php-fpm limpia el entorno de los workers (clear_env = yes), y con
; eso OPENSSL_CONF y OPENSSL_MODULES no llegan a las peticiones web. El
; diagnóstico `php artisan sunat:openssl` se ejecuta por CLI y sí las ve, así
; que el fallo solo aparece al subir el certificado desde la interfaz.
;
; Sin esto, PHP no carga el proveedor "legacy" de OpenSSL 3 y no puede abrir los
; .p12/.pfx que emite SUNAT (cifrados con RC2/3DES).

[www]
clear_env = no