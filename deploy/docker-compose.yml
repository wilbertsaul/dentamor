# ============================================================
# Dentamor - stack de produccion para CONTABO (solo dentamor_app)
# ============================================================
# Levanta SOLO el servicio PHP-FPM de la app. NO incluye nginx ni
# mysql: en el servidor ya existen jemigra_web (proxy 80/443) y el
# mysql centralizado (c6600299f82a_jemigra_db / alias jemigra_db).
#
# RED: la app DEBE quedar en la MISMA red docker que nginx y el
# mysql (jemigra_jemigra_net). Se define con ${DENTAMOR_NET} (externa):
#   DENTAMOR_NET=jemigra_jemigra_net docker compose -f deploy/docker-compose.yml up -d --build
# (deploy.sh se encarga de detectarla/ponerla).
#
# .env: se monta desde la raiz del repo (../.env) en runtime.
#       Los cambios de .env NO requieren rebuild, solo recrear:
#       docker compose -f deploy/docker-compose.yml up -d
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: dentamor_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../.env:/var/www/html/.env
      - dentamor_storage:/var/www/html/storage
    networks:
      - app_net

volumes:
  dentamor_storage:

networks:
  app_net:
    external: true
    name: ${DENTAMOR_NET}