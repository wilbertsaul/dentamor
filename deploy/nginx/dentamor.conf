# ============================================================
# Dentamor - server block para el nginx compartido (jemigra_web)
# ============================================================
# Instalar SOLO como ULTIMO paso del deploy, con doble chequeo:
#   docker cp deploy/nginx/dentamor.conf jemigra_web:/etc/nginx/conf.d/dentamor.conf
#   docker exec jemigra_web nginx -t            # debe decir "syntax is ok"
#   docker exec jemigra_web nginx -s reload     # SOLO si el test paso
#
# IMPORTANTE:
#   - SIN "default_server" (default.conf ya no lo usa; no anadir uno nuevo).
#   - NO tocar default.conf ni reiniciar jemigra_web (nunca restart).
#   - Ajustar las rutas ssl_certificate* a las que ya usa izipay.conf
#     en el servidor (o a un wildcard *.jemigra.com si existe).
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name dentamor.jemigra.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dentamor.jemigra.com;

    ssl_certificate     /etc/nginx/ssl/live/dentamor.jemigra.com/fullchain.pem;   # AJUSTAR
    ssl_certificate_key /etc/nginx/ssl/live/dentamor.jemigra.com/privkey.pem;     # AJUSTAR

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass dentamor_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}